<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeonCase - Casino</title><link rel="stylesheet" href="styles.css"/></head>
<body data-page="casino"><div id="seasonFx" class="season-fx"></div><div class="app-shell"><aside id="sidebar" class="sidebar glass"><div class="side-head"><h1>NeonCase</h1><button id="toggleSidebar">☰</button></div><div class="wallet glass"><div><small>Balance</small><strong id="money"></strong></div><div><small>Bank</small><strong id="bankMoney"></strong></div><div><small>Rank</small><strong id="rank"></strong></div></div><nav class="side-nav"><a href="index.html" class="">Dashboard</a>
<a href="click.html" class="">Click</a>
<a href="cases.html" class="">Cases</a>
<a href="casino.html" class="active">Casino</a>
<a href="battles.html" class="">Battles</a>
<a href="market.html" class="">Market</a>
<a href="inventory.html" class="">Inventory</a>
<a href="database.html" class="">Database</a>
<a href="help.html" class="">Help</a>
<a href="stats.html" class="">Stats</a></nav><div class="auth-actions"><button id="openAuth">Sign In</button><button id="themeToggle">Theme</button></div></aside><main class="content"><section class="panel glass"><h2>Casino</h2><div class="row-wrap"><select id="gameSelect"><option>Blackjack</option><option>Roulette</option><option>Coinflip</option><option>Crash</option><option>Jackpot</option><option>Mines</option><option>Slots</option><option>Plinko</option></select><input id="betAmount" type="number" min="1" value="10"/><button id="playGame">Play</button></div><div id="casinoUI" class="casino-ui"></div><p id="casinoOutput"></p></section></main></div>
<dialog id="authModal" class="glass"><h3>Login</h3><input id="username" placeholder="username"/><div class="row-wrap"><button id="signup">Signup</button><button id="login">Login</button><button id="logout">Logout</button><button id="closeAuth">Close</button></div><p id="authStatus"></p></dialog>
<dialog id="bidModal" class="glass"><h3>Place Bid</h3><p id="bidItem"></p><input id="bidInput" type="number" min="1" value="5"/><div class="row-wrap"><button id="confirmBid">Confirm Bid</button><button id="cancelBid">Cancel</button></div><div id="bidWheel" class="mini-wheel"></div></dialog>
<script src="app.js"></script></body></html>
