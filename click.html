<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeonCase - Click</title><link rel="stylesheet" href="styles.css"/></head>
<body data-page="clicker"><div id="seasonFx" class="season-fx"></div><div class="app-shell"><aside id="sidebar" class="sidebar glass"><div class="side-head"><h1>NeonCase</h1><button id="toggleSidebar">☰</button></div><div class="wallet glass"><div><small>Balance</small><strong id="money"></strong></div><div><small>Bank</small><strong id="bankMoney"></strong></div><div><small>Rank</small><strong id="rank"></strong></div></div><nav class="side-nav"><a href="index.html" class="">Dashboard</a>
<a href="click.html" class="active">Click</a>
<a href="cases.html" class="">Cases</a>
<a href="casino.html" class="">Casino</a>

<a href="help.html" class="">Help</a>
<a href="stats.html" class="">Stats</a></nav><div class="auth-actions"><button id="openAuth">Sign In</button><button id="themeToggle">Theme</button></div></aside><main class="content"><section class="panel glass"><h2>Click</h2><div class="grid two"><article class="panel glass"><button id="moneyClick" class="coin-btn" aria-label="coin"></button><p>Per click: <span id="perClick"></span></p><p>XP/Level: <span id="xpLevel"></span></p><p>Loyalty: <span id="loyalty"></span> | Streak: <span id="streak"></span></p><div class="row-wrap"><button class="upgrade" data-upg="click" id="upgClick"></button><button class="upgrade" data-upg="auto" id="upgAuto"></button><button class="upgrade" data-upg="luck" id="upgLuck"></button><button id="redeemLoyalty">Redeem 100 loyalty</button></div></article><article class="panel glass"><h3>Loyalty Customization Shop</h3><div class="row-wrap"><button class="loyalty-shop" data-item="violet">Violet Theme (150)</button><button class="loyalty-shop" data-item="neon">Neon Glow (200)</button><button class="loyalty-shop" data-item="dense">Dense FX (120)</button></div></article></div></section></main></div>
<dialog id="authModal" class="glass"><h3>Login</h3><input id="username" placeholder="username"/><div class="row-wrap"><button id="signup">Signup</button><button id="login">Login</button><button id="logout">Logout</button><button id="closeAuth">Close</button></div><p id="authStatus"></p></dialog>
<dialog id="bidModal" class="glass"><h3>Place Bid</h3><p id="bidItem"></p><input id="bidInput" type="number" min="1" value="5"/><div class="row-wrap"><button id="confirmBid">Confirm Bid</button><button id="cancelBid">Cancel</button></div><div id="bidWheel" class="mini-wheel"></div></dialog>
<script src="app.js"></script></body></html>
